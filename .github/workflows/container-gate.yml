name: Candidate Container
permissions:
  contents: read
jobs:
  candidate:
    name: candidate-${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
        - arch: amd64
          runner: ubuntu-24.04
        - arch: arm64
          runner: ubuntu-24.04-arm
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - name: Verify native runner
      if: matrix.arch == 'arm64'
      run: test "$(uname -m)" = "aarch64"
    - name: Build exact candidate
      uses: Hartmannlight/pipeline-toolkit/actions/build@abb469f033ee28e00ba1061a47dddfc7d961129a
      with:
        context: .
        file: Dockerfile
        image: candidate:gate
        platform: linux/${{ matrix.arch }}
    - name: Runtime smoke test with PostgreSQL
      run: python3 scripts/container_smoke.py candidate:gate
    - uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567
      with:
        version: v0.74.0
        cache: true
    - name: Scan candidate and create SBOM
      run: |
        mkdir -p artifacts
        trivy image --scanners vuln,secret,misconfig --format json --output artifacts/scan.json candidate:gate
        python3 scripts/security_gate.py artifacts/scan.json
        trivy image --format spdx-json --output artifacts/sbom.spdx.json candidate:gate
        docker save candidate:gate -o artifacts/image.tar
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: candidate-${{ matrix.arch }}
        path: |
          artifacts/image.tar
          artifacts/sbom.spdx.json
          artifacts/scan.json
        retention-days: 3
        compression-level: 0
'on':
  workflow_call: null
