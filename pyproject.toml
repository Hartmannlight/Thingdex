[project]
name = "thingdex"
version = "0.1.0"
description = "Backend API and source of truth for the Thingdex household inventory"
authors = [
    {name = "Nathaniel Hartmann",email = "nathaniel.hartmann@partner.kit.edu"}
]
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.20.0",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "psycopg[binary]>=3.3.5",
    "pydantic>=2.13.5",
    "sqlalchemy>=2.0.53",
    "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1",
]
docs = [
    "mkdocs-material>=9.7.7,<10",
]

[tool.pytest.ini_options]
addopts = "-p no:cacheprovider"
norecursedirs = ["pytest-cache-files-*"]


[build-system]
requires = ["poetry-core>=2.4.1,<3.0.0"]
build-backend = "poetry.core.masonry.api"
