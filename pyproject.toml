[project]
name = "thingdex"
version = "0.1.0"
description = "Backend API and source of truth for the Thingdex household inventory"
authors = [
    {name = "Nathaniel Hartmann",email = "nathaniel.hartmann@partner.kit.edu"}
]
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.13",
    "fastapi>=0.115",
    "httpx>=0.27",
    "psycopg[binary]>=3.1",
    "pydantic>=2.6",
    "sqlalchemy>=2.0",
    "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]
docs = [
    "mkdocs-material>=9,<10",
]

[tool.pytest.ini_options]
addopts = "-p no:cacheprovider"
norecursedirs = ["pytest-cache-files-*"]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
